name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Matrix runs on Ubuntu, macOS, AND Windows on purpose, not just for
    # completeness: two real bugs in this project (fsync on a read-only
    # file descriptor, and os.rename refusing to overwrite an existing
    # file) only ever showed up on Windows in practice. A single-OS CI
    # matrix would not have caught either one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # -v for a readable log if something fails on a specific OS/
        # Python combination in the matrix - which is exactly the kind
        # of failure this matrix exists to catch.
        run: python -m pytest -v
